    <line x1="7" y1="0" x2="26" y2="0" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="18" y2="5" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="24" y2="4" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
